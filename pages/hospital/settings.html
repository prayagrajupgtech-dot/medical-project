<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Hospital Portal</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="portal">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header"><img src="/images/brand-logo.svg" alt="Logo" class="sidebar-logo"><span class="sidebar-brand">Hospital Portal</span></div>
            <ul class="sidebar-nav">
                <li><a href="/hospital/dashboard">Dashboard</a></li>
                <li><a href="/hospital/doctors">Doctors</a></li>
                <li><a href="/hospital/join-requests">Join Requests</a></li>
                <li><a href="/hospital/departments">Departments</a></li>
                <li><a href="/hospital/patients">Patients</a></li>
                <li><a href="/hospital/staff">Staff</a></li>
                <li><a href="/hospital/profile">Hospital Profile</a></li>
                <li><a href="/hospital/notifications">Notifications</a></li>
                <li><a href="/hospital/settings" class="active">Settings</a></li>
            </ul>
            <div class="sidebar-footer"><button class="btn btn-sm btn-outline btn-block" onclick="logout()" data-i18n="sign_out">Sign Out</button></div>
        </nav>
        <main class="main-content">
            <header class="topbar"><button class="menu-toggle" onclick="toggleSidebar()">☰</button><h1 id="page-title"><span data-i18n="settings">Settings</span></h1><div class="topbar-actions"><button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggle" aria-label="Toggle dark mode" data-i18n-aria="theme_toggle">🌙</button></div></header>
            <div class="content">
                <div class="card">
                    <div class="card-header"><h3 data-i18n="change_password">Change Password</h3></div>
                    <div class="card-body">
                        <div class="form-group"><label data-i18n="current_password">Current Password</label><input type="password" id="currentPassword" class="form-control" required></div>
                        <div class="form-group"><label data-i18n="new_password">New Password</label><input type="password" id="newPassword" class="form-control" required></div>
                        <button class="btn btn-primary" onclick="changePassword()" data-i18n="update_password">Update Password</button>
                    </div>
                </div>
                <div id="languageContainer" style="margin-top:16px;"></div>
            </div>
        </main>
    </div>
    <script src="/js/main.js?v=2.2"></script>
    <script src="/js/i18n.js?v=2.4"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            bootPage('settings', ['hospital_admin']);
            // Init first so the selector shows the SAVED language, then build it
            ShrijalI18n.init({ onLanguageChange: function() { ShrijalI18n.applyLanguageToDOM(); } }).then(function() {
                try { ShrijalI18n.createLanguageSelector('languageContainer'); } catch(e) {}
            }).catch(function() {
                try { ShrijalI18n.createLanguageSelector('languageContainer'); } catch(e) {}
            });
        });
        async function changePassword() {
            var current = document.getElementById('currentPassword').value;
            var newPass = document.getElementById('newPassword').value;
            if (!current || !newPass) { showToast(t('both_fields_required'), 'error'); return; }
            try {
                await api('/auth/change-password', 'POST', { current_password: current, new_password: newPass });
                showToast(t('password_updated'));
                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
            } catch(e) { showToast(t('error_changing_password'), 'error'); }
        }
    </script>
</body>
</html>
