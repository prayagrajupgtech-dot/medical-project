<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Requests - Hospital Portal</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="portal">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header"><img src="/images/brand-logo.svg" alt="Logo" class="sidebar-logo"><span class="sidebar-brand">Hospital Portal</span></div>
            <ul class="sidebar-nav">
                <li><a href="/hospital/dashboard">Dashboard</a></li>
                <li><a href="/hospital/doctors">Doctors</a></li>
                <li><a href="/hospital/join-requests" class="active">Join Requests</a></li>
                <li><a href="/hospital/departments">Departments</a></li>
                <li><a href="/hospital/patients">Patients</a></li>
                <li><a href="/hospital/staff">Staff</a></li>
                <li><a href="/hospital/profile">Hospital Profile</a></li>
                <li><a href="/hospital/notifications">Notifications</a></li>
                <li><a href="/hospital/settings">Settings</a></li>
            </ul>
            <div class="sidebar-footer"><button class="btn btn-sm btn-outline btn-block" onclick="logout()">Sign Out</button></div>
        </nav>
        <main class="main-content">
            <header class="topbar"><button class="menu-toggle" onclick="toggleSidebar()">☰</button><h1>Doctor Join Requests</h1><div class="topbar-actions"><button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggle" aria-label="Toggle dark mode" data-i18n-aria="theme_toggle">🌙</button></div></header>
            <div class="content">
                <div class="card">
                    <div class="card-header">
                        <h3>Pending Requests</h3>
                        <select id="statusFilter" class="form-control" style="display:inline-block;width:auto">
                            <option value="pending">Pending</option>
                            <option value="approved">Approved</option>
                            <option value="rejected">Rejected</option>
                            <option value="">All</option>
                        </select>
                    </div>
                    <div class="card-body" id="requestsList"><p class="text-muted">Loading...</p></div>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/i18n.js?v=2.2"></script>
    <script src="/js/main.js?v=2.1"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            bootPage('join-requests', ['hospital_admin']);
            loadRequests();
            document.getElementById('statusFilter').addEventListener('change', loadRequests);
        });
        async function loadRequests() {
            var status = document.getElementById('statusFilter').value;
            try {
                var requests = await api('/api/hospital/join-requests' + (status ? '?status=' + status : ''));
                var container = document.getElementById('requestsList');
                if (!requests || requests.length === 0) { container.innerHTML = '<p class="text-muted">No requests found</p>'; return; }
                container.innerHTML = requests.map(function(r) {
                    var statusClass = r.status === 'approved' ? 'success' : (r.status === 'pending' ? 'warning' : 'danger');
                    var actions = r.status === 'pending' ?
                        '<div class="btn-group"><button class="btn btn-sm btn-success" onclick="handleRequest(' + r.id + ',\'approve\')">Approve</button><button class="btn btn-sm btn-danger" onclick="handleRequest(' + r.id + ',\'reject\')">Reject</button></div>' :
                        '<span class="badge badge-' + statusClass + '">' + r.status + '</span>';
                    return '<div class="card" style="margin-bottom:12px"><div class="card-body"><div style="display:flex;justify-content:space-between;align-items:start"><div><h4>' + (r.full_name||'Unknown') + '</h4><p class="text-muted">' + (r.specialty||'') + ' &middot; ' + (r.email||'') + '</p>' + (r.message ? '<p><em>"' + r.message + '"</em></p>' : '') + '<p><small>Registration: ' + (r.registration_number||'N/A') + ' &middot; Experience: ' + (r.experience_years||'N/A') + ' years</small></p></div><div>' + actions + '</div></div></div></div>';
                }).join('');
            } catch(e) { console.error(e); }
        }
        async function handleRequest(id, action) {
            if (action === 'reject' && !confirm('Are you sure you want to reject this request?')) return;
            try {
                var result = await api('/api/hospital/join-requests/' + id, 'PATCH', { action: action });
                showToast(result.message || 'Request ' + action + 'd');
                loadRequests();
            } catch(e) { showToast('Error processing request', 'error'); }
        }
    </script>
</body>
</html>
