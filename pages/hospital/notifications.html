<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Hospital Portal</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="portal">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header"><img src="/images/brand-logo.svg" alt="Logo" class="sidebar-logo"><span class="sidebar-brand">Hospital Portal</span></div>
            <ul class="sidebar-nav">
                <li><a href="/hospital/dashboard">Dashboard</a></li>
                <li><a href="/hospital/doctors">Doctors</a></li>
                <li><a href="/hospital/join-requests">Join Requests</a></li>
                <li><a href="/hospital/departments">Departments</a></li>
                <li><a href="/hospital/patients">Patients</a></li>
                <li><a href="/hospital/staff">Staff</a></li>
                <li><a href="/hospital/profile">Hospital Profile</a></li>
                <li><a href="/hospital/notifications" class="active">Notifications</a></li>
                <li><a href="/hospital/settings">Settings</a></li>
            </ul>
            <div class="sidebar-footer"><button class="btn btn-sm btn-outline btn-block" onclick="logout()">Sign Out</button></div>
        </nav>
        <main class="main-content">
            <header class="topbar"><button class="menu-toggle" onclick="toggleSidebar()">☰</button><h1>Notifications</h1><div class="topbar-actions"><button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggle" aria-label="Toggle dark mode" data-i18n-aria="theme_toggle">🌙</button></div></header>
            <div class="content">
                <div class="card">
                    <div class="card-header"><h3>Notifications</h3></div>
                    <div class="card-body" id="notificationsList"><p class="text-muted">Loading...</p></div>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/i18n.js?v=2.2"></script>
    <script src="/js/main.js?v=2.1"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            bootPage('notifications', ['hospital_admin']);
            loadNotifications();
        });
        async function loadNotifications() {
            try {
                var notifications = await api('/hospital/notifications');
                var container = document.getElementById('notificationsList');
                if (!notifications || notifications.length === 0) { container.innerHTML = '<p class="text-muted">No notifications</p>'; return; }
                container.innerHTML = '<table class="table"><thead><tr><th>Title</th><th>Message</th><th>Type</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead><tbody>' +
                    notifications.map(function(n) {
                        var readClass = n.is_read ? '' : ' font-weight-bold';
                        var readBadge = n.is_read ? '<span class="badge badge-success">Read</span>' : '<span class="badge badge-warning">Unread</span>';
                        var markBtn = n.is_read ? '' : '<button class="btn btn-sm btn-outline" onclick="markRead(' + n.id + ')">Mark Read</button>';
                        return '<tr class="' + readClass + '"><td>' + (n.title||'') + '</td><td>' + (n.message||'') + '</td><td><span class="badge badge-info">' + (n.type||'-') + '</span></td><td>' + new Date(n.created_at).toLocaleDateString() + '</td><td>' + readBadge + '</td><td>' + markBtn + '</td></tr>';
                    }).join('') + '</tbody></table>';
            } catch(e) { console.error(e); }
        }
        async function markRead(id) {
            try { await api('/hospital/notifications/' + id + '/read', 'PATCH'); loadNotifications(); } catch(e) { showToast('Error', 'error'); }
        }
    </script>
</body>
</html>
