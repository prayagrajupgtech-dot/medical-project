<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="staff_management">Staff - Hospital Portal</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="portal">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header"><img src="/images/brand-logo.svg" alt="Logo" class="sidebar-logo"><span class="sidebar-brand" data-i18n="hospital_portal">Hospital Portal</span></div>
            <ul class="sidebar-nav">
                <li><a href="/hospital/dashboard">Dashboard</a></li>
                <li><a href="/hospital/doctors">Doctors</a></li>
                <li><a href="/hospital/join-requests">Join Requests</a></li>
                <li><a href="/hospital/departments">Departments</a></li>
                <li><a href="/hospital/patients">Patients</a></li>
                <li><a href="/hospital/staff" class="active">Staff</a></li>
                <li><a href="/hospital/profile">Hospital Profile</a></li>
                <li><a href="/hospital/notifications">Notifications</a></li>
                <li><a href="/hospital/settings">Settings</a></li>
            </ul>
            <div class="sidebar-footer"><button class="btn btn-sm btn-outline btn-block" onclick="logout()" data-i18n="sign_out">Sign Out</button></div>
        </nav>
        <main class="main-content">
            <header class="topbar"><button class="menu-toggle" onclick="toggleSidebar()">☰</button><h1 data-i18n="staff_management">Staff Management</h1><div class="topbar-actions"><button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggle" aria-label="Toggle dark mode" data-i18n-aria="theme_toggle">🌙</button></div></header>
            <div class="content">
                <div class="card">
                    <div class="card-header">
                        <h3 data-i18n="staff_members">Staff Members</h3>
                        <button class="btn btn-sm btn-primary" onclick="showAddStaff()" data-i18n="add_staff">Add Staff</button>
                    </div>
                    <div class="card-body" id="staffList"><p class="text-muted">Loading...</p></div>
                </div>
                <div class="card hidden" id="addStaffForm">
                    <div class="card-header"><h3 data-i18n="add_staff">Add Staff Member</h3></div>
                    <div class="card-body">
                        <div class="form-group"><label data-i18n="name">Name *</label><input type="text" id="staffName" class="form-control" required></div>
                        <div class="form-group"><label data-i18n="role">Role *</label><input type="text" id="staffRole" class="form-control" required></div>
                        <div class="form-group"><label data-i18n="phone">Phone</label><input type="text" id="staffPhone" class="form-control"></div>
                        <div class="form-group"><label data-i18n="email">Email</label><input type="email" id="staffEmail" class="form-control"></div>
                        <div class="form-group"><label data-i18n="department">Department</label><input type="text" id="staffDepartment" class="form-control"></div>
                        <button class="btn btn-primary" onclick="saveStaff()" data-i18n="save">Save</button>
                        <button class="btn btn-outline" onclick="hideAddStaff()" data-i18n="cancel">Cancel</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/i18n.js?v=2.2"></script>
    <script src="/js/main.js?v=2.1"></script>
    <script>
        const t = function(key) { return typeof ShrijalI18n !== 'undefined' ? ShrijalI18n.t(key) : key; };
        document.addEventListener('DOMContentLoaded', function() {
            bootPage('staff', ['hospital_admin']);
            loadStaff();
        });
        async function loadStaff() {
            try {
                var staff = await api('/api/hospital/staff');
                var container = document.getElementById('staffList');
                if (!staff || staff.length === 0) { container.innerHTML = '<p class="text-muted">' + t('no_staff') + '</p>'; return; }
                container.innerHTML = '<table class="table"><thead><tr><th>' + t('name') + '</th><th>' + t('role') + '</th><th>' + t('phone') + '</th><th>' + t('email') + '</th><th>' + t('department') + '</th><th>' + t('actions') + '</th></tr></thead><tbody>' +
                    staff.map(function(s) {
                        return '<tr><td><strong>' + (s.name||'') + '</strong></td><td>' + (s.role||'-') + '</td><td>' + (s.phone||'-') + '</td><td>' + (s.email||'-') + '</td><td>' + (s.department||'-') + '</td><td><button class="btn btn-sm btn-danger" onclick="deleteStaff(' + s.id + ')">' + t('delete') + '</button></td></tr>';
                    }).join('') + '</tbody></table>';
            } catch(e) { console.error(e); }
        }
        function showAddStaff() { document.getElementById('addStaffForm').classList.remove('hidden'); }
        function hideAddStaff() { document.getElementById('addStaffForm').classList.add('hidden'); document.getElementById('staffName').value = ''; document.getElementById('staffRole').value = ''; document.getElementById('staffPhone').value = ''; document.getElementById('staffEmail').value = ''; document.getElementById('staffDepartment').value = ''; }
        async function saveStaff() {
            var name = document.getElementById('staffName').value.trim();
            var role = document.getElementById('staffRole').value.trim();
            if (!name || !role) { showToast(t('name_role_required'), 'error'); return; }
            try {
                await api('/api/hospital/staff', 'POST', { name: name, role: role, phone: document.getElementById('staffPhone').value.trim(), email: document.getElementById('staffEmail').value.trim(), department: document.getElementById('staffDepartment').value.trim() });
                showToast(t('staff_added'));
                hideAddStaff();
                loadStaff();
            } catch(e) { showToast(t('error_adding_staff'), 'error'); }
        }
        async function deleteStaff(id) {
            if (!confirm(t('delete_staff_confirm'))) return;
            try { await api('/api/hospital/staff/' + id, 'DELETE'); showToast(t('staff_deleted')); loadStaff(); } catch(e) { showToast(t('error'), 'error'); }
        }
    </script>
</body>
</html>
