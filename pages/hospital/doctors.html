<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors - Hospital Portal</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="portal">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header"><img src="/images/brand-logo.svg" alt="Logo" class="sidebar-logo"><span class="sidebar-brand">Hospital Portal</span></div>
            <ul class="sidebar-nav">
                <li><a href="/hospital/dashboard">Dashboard</a></li>
                <li><a href="/hospital/doctors" class="active">Doctors</a></li>
                <li><a href="/hospital/join-requests">Join Requests</a></li>
                <li><a href="/hospital/departments">Departments</a></li>
                <li><a href="/hospital/patients">Patients</a></li>
                <li><a href="/hospital/staff">Staff</a></li>
                <li><a href="/hospital/profile">Hospital Profile</a></li>
                <li><a href="/hospital/notifications">Notifications</a></li>
                <li><a href="/hospital/settings">Settings</a></li>
            </ul>
            <div class="sidebar-footer"><button class="btn btn-sm btn-outline btn-block" onclick="logout()">Sign Out</button></div>
        </nav>
        <main class="main-content">
            <header class="topbar"><button class="menu-toggle" onclick="toggleSidebar()">☰</button><h1>Hospital Doctors</h1><div class="topbar-actions"><button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggle" aria-label="Toggle dark mode" data-i18n-aria="theme_toggle">🌙</button></div></header>
            <div class="content">
                <div class="card">
                    <div class="card-header">
                        <h3>Approved Doctors</h3>
                        <div>
                            <input type="text" id="searchInput" placeholder="Search doctors..." class="form-control" style="display:inline-block;width:auto">
                            <select id="statusFilter" class="form-control" style="display:inline-block;width:auto">
                                <option value="approved">Approved</option>
                                <option value="pending">Pending</option>
                                <option value="rejected">Rejected</option>
                                <option value="">All</option>
                            </select>
                        </div>
                    </div>
                    <div class="card-body" id="doctorsList"><p class="text-muted">Loading...</p></div>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/i18n.js?v=2.2"></script>
    <script src="/js/main.js?v=2.1"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            bootPage('doctors', ['hospital_admin']);
            loadDoctors();
            document.getElementById('searchInput').addEventListener('input', loadDoctors);
            document.getElementById('statusFilter').addEventListener('change', loadDoctors);
        });
        async function loadDoctors() {
            var search = document.getElementById('searchInput').value;
            var status = document.getElementById('statusFilter').value;
            var url = '/api/hospital/doctors?' + (status ? 'status=' + status : '') + (search ? '&search=' + encodeURIComponent(search) : '');
            try {
                var doctors = await api(url);
                var container = document.getElementById('doctorsList');
                if (!doctors || doctors.length === 0) { container.innerHTML = '<p class="text-muted">No doctors found</p>'; return; }
                container.innerHTML = '<table class="table"><thead><tr><th>Name</th><th>Specialty</th><th>Department</th><th>Status</th><th>Registered</th></tr></thead><tbody>' +
                    doctors.map(function(d) {
                        var statusClass = d.status === 'approved' ? 'success' : (d.status === 'pending' ? 'warning' : 'danger');
                        return '<tr><td><strong>' + (d.full_name||'') + '</strong><br><small>' + (d.email||'') + '</small></td><td>' + (d.specialty||'-') + '</td><td>' + (d.department||'-') + '</td><td><span class="badge badge-' + statusClass + '">' + d.status + '</span></td><td>' + new Date(d.created_at).toLocaleDateString() + '</td></tr>';
                    }).join('') + '</tbody></table>';
            } catch(e) { console.error(e); }
        }
    </script>
</body>
</html>
