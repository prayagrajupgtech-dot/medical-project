<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="patients">Patients - Hospital Portal</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="portal">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header"><img src="/images/brand-logo.svg" alt="Logo" class="sidebar-logo"><span class="sidebar-brand" data-i18n="hospital_portal">Hospital Portal</span></div>
            <ul class="sidebar-nav">
                <li><a href="/hospital/dashboard">Dashboard</a></li>
                <li><a href="/hospital/doctors">Doctors</a></li>
                <li><a href="/hospital/join-requests">Join Requests</a></li>
                <li><a href="/hospital/departments">Departments</a></li>
                <li><a href="/hospital/patients" class="active">Patients</a></li>
                <li><a href="/hospital/staff">Staff</a></li>
                <li><a href="/hospital/profile">Hospital Profile</a></li>
                <li><a href="/hospital/notifications">Notifications</a></li>
                <li><a href="/hospital/settings">Settings</a></li>
            </ul>
            <div class="sidebar-footer"><button class="btn btn-sm btn-outline btn-block" onclick="logout()" data-i18n="sign_out">Sign Out</button></div>
        </nav>
        <main class="main-content">
            <header class="topbar"><button class="menu-toggle" onclick="toggleSidebar()">☰</button><h1 data-i18n="patients">Hospital Patients</h1><div class="topbar-actions"><button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggle" aria-label="Toggle dark mode" data-i18n-aria="theme_toggle">🌙</button></div></header>
            <div class="content">
                <div class="card">
                    <div class="card-header">
                        <h3 data-i18n="patients">Patients</h3>
                        <input type="text" id="searchInput" data-i18n-placeholder="search_patients_placeholder" placeholder="Search patients..." class="form-control" style="display:inline-block;width:auto">
                    </div>
                    <div class="card-body" id="patientsList"><p class="text-muted">Loading...</p></div>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/i18n.js?v=2.2"></script>
    <script src="/js/main.js?v=2.1"></script>
    <script>
        const t = function(key) { return typeof ShrijalI18n !== 'undefined' ? ShrijalI18n.t(key) : key; };
        document.addEventListener('DOMContentLoaded', function() {
            bootPage('patients', ['hospital_admin']);
            loadPatients();
            document.getElementById('searchInput').addEventListener('input', loadPatients);
        });
        async function loadPatients() {
            var search = document.getElementById('searchInput').value;
            var url = '/api/hospital/patients' + (search ? '?search=' + encodeURIComponent(search) : '');
            try {
                var patients = await api(url);
                var container = document.getElementById('patientsList');
                if (!patients || patients.length === 0) { container.innerHTML = '<p class="text-muted">' + t('no_patients_found') + '</p>'; return; }
                container.innerHTML = '<table class="table"><thead><tr><th>' + t('name') + '</th><th>' + t('email') + '</th><th>' + t('phone') + '</th><th>' + t('appointments') + '</th></tr></thead><tbody>' +
                    patients.map(function(p) {
                        return '<tr><td><strong>' + (p.full_name||'') + '</strong></td><td>' + (p.email||'-') + '</td><td>' + (p.phone||'-') + '</td><td>' + (p.appointment_count||0) + '</td></tr>';
                    }).join('') + '</tbody></table>';
            } catch(e) { console.error(e); }
        }
    </script>
</body>
</html>
