<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors - AI Doctor Assistant</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="admin-header">
        <div class="container">
            <div class="admin-header-content">
                <div class="admin-brand">
                    <img src="/favicon.png" alt="AI Doctor Assistant">
                    <span data-i18n="app_name">AI Doctor Assistant</span> - <span data-i18n="patient_portal">Patient Portal</span>
                </div>
                <div class="admin-user">
                    <span id="userDisplay">Patient</span>
                    <button class="btn btn-sm btn-outline" onclick="logout()"><span data-i18n="logout">Logout</span></button>
                    <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggle" aria-label="Toggle dark mode" data-i18n-aria="theme_toggle">🌙</button>
                </div>
            </div>
        </div>
    </header>

    <nav class="admin-nav" aria-label="Main navigation">
        <div class="container">
            <button class="admin-nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <ul>
                <li><a href="/patient/dashboard" data-nav="dashboard" data-i18n="dashboard">Dashboard</a></li>
                <li><a href="/patient/doctors" data-nav="doctors" class="active" aria-current="page" data-i18n="doctors">Doctors</a></li>
                <li><a href="/patient/appointments" data-nav="appointments" data-i18n="appointments">Appointments</a></li>
                <li><a href="/patient/consultations" data-nav="consultations" data-i18n="consultations">Consultations</a></li>
                <li><a href="/patient/reports" data-nav="reports" data-i18n="reports">Reports</a></li>
                <li><a href="/patient/prescriptions" data-nav="prescriptions" data-i18n="prescriptions">Prescriptions</a></li>
                <li><a href="/patient/messages" data-nav="messages" data-i18n="messages">Messages</a></li>
                <li><a href="/patient/profile" data-nav="profile" data-i18n="profile">Profile</a></li>
                <li><a href="/patient/settings" data-nav="settings" data-i18n="settings">Settings</a></li>
                <li><a href="/patient/ai-assistant" class="admin-nav-item" data-page="ai-assistant" data-i18n="ai_assistant">
                    <span class="admin-nav-icon">🤖</span>
                    <span class="admin-nav-label">AI Assistant</span>
                </a></li>
            </ul>
        </div>
    </nav>

    <section class="admin-section">
        <div class="container">
            <div class="dashboard-welcome">
                <h1><span data-i18n="doctors">Doctors</span></h1>
                <p data-i18n="find_doctors_desc">Find and connect with our specialists</p>
            </div>

            <div class="toolbar" role="search">
                <input type="search" id="searchInput" class="form-control search-input" placeholder="Search by name or specialty..." data-i18n-placeholder="search_doctors_placeholder" aria-label="Search doctors">
            </div>
            <div id="doctorsGrid" class="mt-3" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px;"></div>
            <div id="doctorsState"></div>
        </div>
    </section>

    <script src="/js/i18n.js?v=2.2"></script>
    <script src="/js/main.js?v=2.1"></script>
    <script>
        let allDoctors = [];

        document.addEventListener('DOMContentLoaded', function () {
            if (!bootPage('doctors', ['patient'])) return;
            document.getElementById('searchInput').addEventListener('input', renderDoctors);
            loadDoctors();
        });

        async function loadDoctors() {
            try {
                allDoctors = await api('/doctors');
                renderDoctors();
            } catch (err) {
                showErrorState(document.getElementById('doctorsState'), 'Unable to load doctors. ' + err.message, 'loadDoctors');
            }
        }

        function renderDoctors() {
            const t = function(key) { return typeof ShrijalI18n !== 'undefined' ? ShrijalI18n.t(key) : key; };
            const grid = document.getElementById('doctorsGrid');
            const state = document.getElementById('doctorsState');
            grid.innerHTML = '';
            state.innerHTML = '';

            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            let list = allDoctors.filter(d => {
                if (!search) return true;
                return [d.full_name, d.specialty, d.hospital].filter(Boolean).join(' ').toLowerCase().includes(search);
            });

            if (!list.length) {
                showEmptyState(state, allDoctors.length ? t('no_doctors_match') : t('no_doctors_available'));
                return;
            }

            grid.innerHTML = list.map(d => `
                <div class="doctor-card">
                    ${avatarHtml(d.full_name, d.photo, 'lg')}
                    <div style="flex:1; min-width: 200px;">
                        <h3>${escapeHtml(d.full_name || t('doctor'))}</h3>
                        <div class="doctor-meta">${escapeHtml(d.specialty || t('general_practice'))}${d.qualification ? ' &middot; ' + escapeHtml(d.qualification) : ''}</div>
                        <div class="doctor-meta">
                            ${d.verified ? '<span class="badge-verified">&#10003; ' + t('verified') + '</span>' : '<span class="badge-unverified">' + t('pending_verification') + '</span>'}
                            ${d.rating ? `<span class="rating-stars">&#9733;&#9733;&#9733;&#9733;&#9733;</span> <span class="rating-count">${d.rating} (${d.review_count})</span>` : '<span class="rating-count">' + t('new_doctor') + '</span>'}
                        </div>
                        <div class="doctor-meta">${d.experience_years ? d.experience_years + ' ' + t('years_experience') : ''}${d.hospital ? ' &middot; ' + escapeHtml(d.hospital) : ''}</div>
                        ${d.consultation_fee ? '<div class="doctor-meta">' + t('consultation_fee') + ': <span class="fee-tag">&#8377;' + d.consultation_fee + '</span></div>' : ''}
                        ${d.bio ? `<p style="font-size:0.85rem; color:var(--gray); margin-bottom:10px;">${escapeHtml(d.bio.substring(0, 120))}${d.bio.length > 120 ? '&hellip;' : ''}</p>` : ''}
                        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
                            <a href="/patient/messages?to=${d.id}" class="btn btn-sm btn-outline">${t('messages')}</a>
                            <a href="/patient/appointments" class="btn btn-sm btn-primary" onclick="event.preventDefault(); preselectDoctor(${d.id}, '${escapeHtml(d.full_name)}')">${t('book_appointment')}</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function preselectDoctor(id, name) {
            localStorage.setItem('pat_preferred_doctor_id', id);
            localStorage.setItem('pat_preferred_doctor_name', name);
            window.location.href = '/patient/appointments?book=' + id;
        }
    </script>
</body>
</html>
