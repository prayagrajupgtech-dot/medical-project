<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - AI Doctor Assistant</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="admin-header">
        <div class="container">
            <div class="admin-header-content">
                <div class="admin-brand">
                    <img src="/favicon.png" alt="AI Doctor Assistant">
                    <span>AI Doctor Assistant - <span data-i18n="app_name">AI Doctor Assistant</span> - <span data-i18n="patient_portal">Patient Portal</span></span>
                </div>
                <div class="admin-user">
                    <span id="userDisplay">Patient</span>
                    <button class="btn btn-sm btn-outline" onclick="logout()"><span data-i18n="logout">Logout</span></button>
                    <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggle" aria-label="Toggle dark mode" data-i18n-aria="theme_toggle">🌙</button>
                </div>
            </div>
        </div>
    </header>

    <nav class="admin-nav" aria-label="Main navigation">
        <div class="container">
            <button class="admin-nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <ul>
                <li><a href="/patient/dashboard" data-nav="dashboard" data-i18n="dashboard">Dashboard</a></li>
                <li><a href="/patient/doctors" data-nav="doctors" data-i18n="doctors">Doctors</a></li>
                <li><a href="/patient/appointments" data-nav="appointments" data-i18n="appointments">Appointments</a></li>
                <li><a href="/patient/consultations" data-nav="consultations" data-i18n="consultations">Consultations</a></li>
                <li><a href="/patient/reports" data-nav="reports" data-i18n="reports">Reports</a></li>
                <li><a href="/patient/prescriptions" data-nav="prescriptions" data-i18n="prescriptions">Prescriptions</a></li>
                <li><a href="/patient/messages" data-nav="messages" data-i18n="messages">Messages</a></li>
                <li><a href="/patient/profile" data-nav="profile" class="active" aria-current="page" data-i18n="profile">Profile</a></li>
                <li><a href="/patient/settings" data-nav="settings" data-i18n="settings">Settings</a></li>
                <li><a href="/patient/ai-assistant" class="admin-nav-item" data-page="ai-assistant" data-i18n="ai_assistant">
                    <span class="admin-nav-icon">🤖</span>
                    <span class="admin-nav-label">AI Assistant</span>
                </a></li>
            </ul>
        </div>
    </nav>

    <section class="admin-section">
        <div class="container">
            <div class="dashboard-welcome">
                <h1><span data-i18n="my_profile">My Profile</span></h1>
                <p data-i18n="profile_desc">Your personal and medical information</p>
            </div>

            <div id="profileContent">
                <div class="state-block"><span class="spinner" aria-hidden="true"></span><p><span data-i18n="loading">Loading profile...</span></p></div>
            </div>
        </div>
    </section>

    <script src="/js/i18n.js?v=2.2"></script>
    <script src="/js/main.js?v=2.1"></script>
    <script>
        let profile = null;

        document.addEventListener('DOMContentLoaded', function () {
            if (!bootPage('profile', ['patient'])) return;
            loadProfile();
        });

        async function loadProfile() {
            try {
                const data = await api('/patients/me');
                profile = data.patient;
                renderProfile();
            } catch (err) {
                document.getElementById('profileContent').innerHTML = '';
                showErrorState(document.getElementById('profileContent'), 'Unable to load profile. ' + err.message, 'loadProfile');
            }
        }

        function renderProfile() {
            const t = function(key) { return typeof ShrijalI18n !== 'undefined' ? ShrijalI18n.t(key) : key; };
            const p = profile;
            const avatar = avatarHtml(p.full_name, p.photo, 'xl');
            document.getElementById('profileContent').innerHTML = `
                <div class="admin-card">
                    <div class="profile-summary">
                        <div class="profile-avatar-block">
                            ${avatar}
                            <div class="profile-photo-actions">
                                <button type="button" class="btn btn-sm btn-outline" onclick="managePhoto('change')">${t('upload_photo')}</button>
                                ${p.photo ? `<button type="button" class="btn btn-sm btn-outline" onclick="managePhoto('remove')">${t('remove_photo')}</button>` : ''}
                            </div>
                        </div>
                        <div>
                            <h1>${escapeHtml(p.full_name || 'Patient')}</h1>
                            <p class="text-muted">${escapeHtml(p.email || '')}${p.phone ? ' &middot; ' + escapeHtml(p.phone) : ''}</p>
                        </div>
                    </div>

                    <div class="detail-tabs" role="tablist" aria-label="Profile sections">
                        <button type="button" class="tab-btn active" data-tab="view" onclick="switchTab('view', this)">${t('view')}</button>
                        <button type="button" class="tab-btn" data-tab="edit" onclick="switchTab('edit', this)">${t('edit')}</button>
                    </div>

                    <div class="detail-panel active" id="panel-view">
                        <div class="profile-grid">
                            <div class="profile-field"><label>${t('full_name')}</label><p>${escapeHtml(p.full_name || 'N/A')}</p></div>
                            <div class="profile-field"><label>${t('email')}</label><p>${escapeHtml(p.email || 'N/A')}</p></div>
                            <div class="profile-field"><label>${t('phone')}</label><p>${escapeHtml(p.phone || 'N/A')}</p></div>
                            <div class="profile-field"><label>${t('date_of_birth')}</label><p>${escapeHtml(p.date_of_birth || 'N/A')}</p></div>
                            <div class="profile-field"><label>${t('gender')}</label><p>${escapeHtml((p.gender || 'N/A').charAt(0).toUpperCase() + (p.gender || 'n/a').slice(1))}</p></div>
                            <div class="profile-field"><label>${t('blood_group')}</label><p>${escapeHtml(p.blood_type || 'N/A')}</p></div>
                            <div class="profile-field"><label>${t('height')}</label><p>${p.height ? escapeHtml(p.height) + ' cm' : 'N/A'}</p></div>
                            <div class="profile-field"><label>${t('weight')}</label><p>${p.weight ? escapeHtml(p.weight) + ' kg' : 'N/A'}</p></div>
                            <div class="profile-field"><label>${t('address')}</label><p>${escapeHtml(p.address || 'N/A')}</p></div>
                            <div class="profile-field"><label>${t('emergency_contact')}</label><p>${escapeHtml(p.emergency_contact || 'N/A')}</p></div>
                            <div class="profile-field"><label>${t('allergies')}</label><p>${escapeHtml(p.allergies || t('no_known_allergies'))}</p></div>
                            <div class="profile-field"><label>${t('medical_conditions')}</label><p>${escapeHtml(p.chronic_conditions || t('none_documented'))}</p></div>
                            <div class="profile-field"><label>${t('current_medications')}</label><p>${escapeHtml(p.current_medications || t('none'))}</p></div>
                        </div>
                    </div>

                    <div class="detail-panel" id="panel-edit">
                        <div class="profile-edit-grid">
                            <div class="form-group"><label for="f_dob">${t('date_of_birth')}</label><input type="date" id="f_dob" class="form-control" value="${escapeHtml(p.date_of_birth || '')}"></div>
                            <div class="form-group"><label for="f_gender">${t('gender')}</label>
                                <select id="f_gender" class="form-control">
                                    <option value="">${t('select')}</option>
                                    <option value="male" ${p.gender === 'male' ? 'selected' : ''}>Male</option>
                                    <option value="female" ${p.gender === 'female' ? 'selected' : ''}>Female</option>
                                    <option value="other" ${p.gender === 'other' ? 'selected' : ''}>Other</option>
                                </select>
                            </div>
                            <div class="form-group"><label for="f_blood">${t('blood_group')}</label>
                                <select id="f_blood" class="form-control">
                                    <option value="">${t('select')}</option>
                                    ${['A+','A-','B+','B-','AB+','AB-','O+','O-'].map(b => `<option value="${b}" ${p.blood_type === b ? 'selected' : ''}>${b}</option>`).join('')}
                                </select>
                            </div>
                            <div class="form-group"><label for="f_height">${t('height')} (cm)</label><input type="number" id="f_height" class="form-control" value="${p.height || ''}" min="0"></div>
                            <div class="form-group"><label for="f_weight">${t('weight')} (kg)</label><input type="number" id="f_weight" class="form-control" value="${p.weight || ''}" min="0"></div>
                            <div class="form-group"><label for="f_emergency">${t('emergency_contact')}</label><input type="text" id="f_emergency" class="form-control" value="${escapeHtml(p.emergency_contact || '')}"></div>
                            <div class="form-group"><label for="f_address">${t('address')}</label><input type="text" id="f_address" class="form-control" value="${escapeHtml(p.address || '')}"></div>
                            <div class="form-group"><label for="f_allergies">${t('allergies')}</label><input type="text" id="f_allergies" class="form-control" value="${escapeHtml(p.allergies || '')}"></div>
                            <div class="form-group"><label for="f_conditions">${t('medical_conditions')}</label><input type="text" id="f_conditions" class="form-control" value="${escapeHtml(p.chronic_conditions || '')}"></div>
                            <div class="form-group"><label for="f_medications">${t('current_medications')}</label><input type="text" id="f_medications" class="form-control" value="${escapeHtml(p.current_medications || '')}"></div>
                        </div>
                        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;">
                            <button class="btn btn-primary" onclick="saveProfile()">${t('save_changes')}</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function switchTab(tabName, btn) {
            document.querySelectorAll('.detail-tabs .tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.detail-panel').forEach(p2 => p2.classList.remove('active'));
            btn.classList.add('active');
            const panel = document.getElementById('panel-' + tabName);
            if (panel) panel.classList.add('active');
        }

        function managePhoto(action) {
            openPhotoManager({ role: 'patient', user: profile, start: action, onUpdated: () => loadProfile() });
        }

        async function saveProfile() {
            const t = function(key) { return typeof ShrijalI18n !== 'undefined' ? ShrijalI18n.t(key) : key; };
            const btn = event.target;
            btn.disabled = true;
            try {
                await api('/patients/me', 'PUT', {
                    date_of_birth: document.getElementById('f_dob').value || null,
                    gender: document.getElementById('f_gender').value || null,
                    blood_type: document.getElementById('f_blood').value || null,
                    height: document.getElementById('f_height').value ? Number(document.getElementById('f_height').value) : null,
                    weight: document.getElementById('f_weight').value ? Number(document.getElementById('f_weight').value) : null,
                    emergency_contact: document.getElementById('f_emergency').value,
                    address: document.getElementById('f_address').value,
                    allergies: document.getElementById('f_allergies').value,
                    chronic_conditions: document.getElementById('f_conditions').value,
                    current_medications: document.getElementById('f_medications').value
                });
                showToast(t('profile_updated'));
                await loadProfile();
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
