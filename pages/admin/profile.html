<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile - AI Doctor Assistant</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="admin-header">
        <div class="container">
            <div class="admin-header-content">
                <div class="admin-brand">
                    <img src="/favicon.png" alt="AI Doctor Assistant">
                    <span>AI Doctor Assistant - Admin Panel</span>
                </div>
                <div class="admin-user">
                    <span id="userDisplay">Administrator</span>
                    <button class="btn btn-sm btn-outline" onclick="logout()"><span data-i18n="logout">Logout</span></button>
                    <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggle" aria-label="Toggle dark mode" data-i18n-aria="theme_toggle">🌙</button>
                </div>
            </div>
        </div>
    </header>

    <nav class="admin-nav" aria-label="Main navigation">
        <div class="container">
            <button class="admin-nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <ul>
                <li><a href="/admin/dashboard" data-nav="dashboard" data-i18n="dashboard">Dashboard</a></li>
                <li><a href="/admin/doctors" data-nav="doctors" data-i18n="doctors">Doctors</a></li>
                <li><a href="/admin/patients" data-nav="patients" data-i18n="patients">Patients</a></li>
                <li><a href="/admin/appointments" data-nav="appointments" data-i18n="appointments">Appointments</a></li>
                <li><a href="/admin/consultations" data-nav="consultations" data-i18n="consultations">Consultations</a></li>
                <li><a href="/admin/messages" data-nav="messages" data-i18n="messages">Messages</a></li>
                <li><a href="/admin/reports" data-nav="reports" data-i18n="reports">Reports</a></li>
                <li><a href="/admin/audit-logs" data-nav="audit-logs" data-i18n="audit-logs">Audit Logs</a></li>
                <li><a href="/admin/profile" data-nav="profile" class="active" aria-current="page" data-i18n="profile">Profile</a></li>
                <li><a href="/admin/settings" data-nav="settings" data-i18n="settings">Settings</a></li>
                <li><a href="/admin/knowledge-base" data-nav="knowledge-base" data-i18n="knowledge-base">Knowledge Base</a></li>
                <li><a href="/admin/ai-assistant" class="admin-nav-item" data-page="ai-assistant" data-i18n="ai_assistant">
                    <span class="admin-nav-icon">🤖</span>
                    <span class="admin-nav-label">AI Assistant</span>
                </a></li>
            </ul>
        </div>
    </nav>

    <section class="admin-section">
        <div class="container">
            <div class="dashboard-welcome">
                <h1>Admin Profile</h1>
                <p>Your administrator account information</p>
            </div>

            <div id="profileContent">
                <div class="state-block"><span class="spinner" aria-hidden="true"></span><p>Loading profile...</p></div>
            </div>
        </div>
    </section>

    <script src="/js/i18n.js?v=2.2"></script>
    <script src="/js/main.js?v=2.1"></script>
    <script>
        let profile = null;

        document.addEventListener('DOMContentLoaded', function () {
            if (!bootPage('profile', ['admin'])) return;
            loadProfile();
        });

        async function loadProfile() {
            try {
                const data = await api('/admin/profile');
                profile = data.user;
                renderProfile();
            } catch (err) {
                document.getElementById('profileContent').innerHTML = '';
                showErrorState(document.getElementById('profileContent'), 'Unable to load profile. ' + err.message, 'loadProfile');
            }
        }

        function renderProfile() {
            const u = profile;
            const avatar = avatarHtml(u.full_name, u.photo, 'xl');
            document.getElementById('profileContent').innerHTML = `
                <div class="admin-card">
                    <div class="profile-summary">
                        <div class="profile-avatar-block">
                            ${avatar}
                            <div class="profile-photo-actions">
                                <button type="button" class="btn btn-sm btn-outline" onclick="managePhoto('change')">Change Photo</button>
                                ${u.photo ? '<button type="button" class="btn btn-sm btn-outline" onclick="managePhoto(\'remove\')">Remove Photo</button>' : ''}
                            </div>
                        </div>
                        <div>
                            <h1>${escapeHtml(u.full_name || 'Administrator')}</h1>
                            <p class="text-muted">Role: <span class="status-badge status-verified">Administrator</span> &middot; ${accountBadge(u.accountStatus)}</p>
                            <p class="text-muted">${escapeHtml(u.email || '')}</p>
                        </div>
                    </div>

                    <div class="detail-tabs" role="tablist" aria-label="Profile sections">
                        <button type="button" class="tab-btn active" data-tab="view" onclick="switchTab('view', this)">View</button>
                        <button type="button" class="tab-btn" data-tab="edit" onclick="switchTab('edit', this)">Edit Profile</button>
                        <button type="button" class="tab-btn" data-tab="password" onclick="switchTab('password', this)">Change Password</button>
                    </div>

                    <div class="detail-panel active" id="panel-view">
                        <div class="profile-grid">
                            <div class="profile-field"><label>Full Name</label><p>${escapeHtml(u.full_name || 'N/A')}</p></div>
                            <div class="profile-field"><label>Username</label><p>${escapeHtml(u.username || 'N/A')}</p></div>
                            <div class="profile-field"><label>Email</label><p>${escapeHtml(u.email || 'N/A')}</p></div>
                            <div class="profile-field"><label>Phone</label><p>${escapeHtml(u.phone || 'N/A')}</p></div>
                            <div class="profile-field"><label>Role</label><p>Administrator</p></div>
                            <div class="profile-field"><label>Account Status</label><p>${accountBadge(u.accountStatus)}</p></div>
                            <div class="profile-field"><label>Registered</label><p>${formatDateTime(u.created_at)}</p></div>
                            <div class="profile-field"><label>Last Login</label><p>${u.lastLoginAt ? formatDateTime(u.lastLoginAt) : 'Never'}</p></div>
                        </div>
                    </div>

                    <div class="detail-panel" id="panel-edit">
                        <div class="profile-edit-grid">
                            <div class="form-group"><label for="f_name">Full Name</label><input type="text" id="f_name" class="form-control" value="${escapeHtml(u.full_name || '')}"></div>
                            <div class="form-group"><label for="f_phone">Phone</label><input type="text" id="f_phone" class="form-control" value="${escapeHtml(u.phone || '')}"></div>
                            <div class="form-group"><label for="f_email">Email</label><input type="email" id="f_email" class="form-control" value="${escapeHtml(u.email || '')}"></div>
                            <div class="form-group"><label>Username</label><input type="text" class="form-control" value="${escapeHtml(u.username || '')}" disabled><small class="doctor-meta">Username cannot be changed</small></div>
                        </div>
                        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;">
                            <button class="btn btn-primary" onclick="saveProfile()">Save Changes</button>
                        </div>
                    </div>

                    <div class="detail-panel" id="panel-password">
                        <div class="form-group"><label for="curPass">Current Password</label><input type="password" id="curPass" class="form-control" autocomplete="current-password"></div>
                        <div class="form-group"><label for="newPass">New Password (min 6 characters)</label><input type="password" id="newPass" class="form-control" autocomplete="new-password"></div>
                        <div class="form-group"><label for="confPass">Confirm New Password</label><input type="password" id="confPass" class="form-control" autocomplete="new-password"></div>
                        <button class="btn btn-primary" onclick="changePassword()">Update Password</button>
                    </div>
                </div>`;
        }

        function switchTab(tabName, btn) {
            document.querySelectorAll('.detail-tabs .tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.detail-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            const panel = document.getElementById('panel-' + tabName);
            if (panel) panel.classList.add('active');
        }

        function managePhoto(action) {
            openPhotoManager({ role: 'admin', user: profile, start: action, onUpdated: () => loadProfile() });
        }

        async function saveProfile() {
            const btn = event.target;
            btn.disabled = true;
            try {
                await api('/admin/profile', 'PUT', {
                    full_name: document.getElementById('f_name').value,
                    phone: document.getElementById('f_phone').value,
                    email: document.getElementById('f_email').value
                });
                showToast('Profile updated successfully');
                await loadProfile();
                btn.disabled = false;
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
            }
        }

        async function changePassword() {
            const cur = document.getElementById('curPass').value;
            const next = document.getElementById('newPass').value;
            const conf = document.getElementById('confPass').value;
            if (!cur || !next) {
                showToast('Fill in all password fields', 'error');
                return;
            }
            if (next !== conf) {
                showToast('New passwords do not match', 'error');
                return;
            }
            const btn = event.target;
            btn.disabled = true;
            try {
                await api('/auth/change-password', 'POST', { current_password: cur, new_password: next });
                showToast('Password changed successfully');
                document.getElementById('curPass').value = '';
                document.getElementById('newPass').value = '';
                document.getElementById('confPass').value = '';
                btn.disabled = false;
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
            }
        }

        function accountBadge(status) {
            const cls = 'status-' + (status || 'active');
            return `<span class="status-badge ${cls}" style="text-transform: capitalize;">${escapeHtml(status || 'active')}</span>`;
        }
    </script>
</body>
</html>
