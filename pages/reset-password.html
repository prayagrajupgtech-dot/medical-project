<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AI Doctor Assistant</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-shell auth-shell-single">

        <main class="auth-main">
            <section class="auth-card" aria-labelledby="rpTitle">
                <div class="auth-card-header">
                    <img src="/images/brand-logo.svg" alt="AI Doctor Assistant logo" class="brand-logo" width="64" height="64">
                    <h2 id="rpTitle">Reset Password</h2>
                    <p class="auth-subtitle">Choose a new password</p>
                </div>

                <div class="form-alert" id="tokenError" role="alert" hidden></div>

                <form id="resetForm" novalidate>
                    <div class="form-group">
                        <label for="resetPassword">New Password *</label>
                        <div class="password-field">
                            <input type="password" id="resetPassword" name="newPassword" class="form-control" autocomplete="new-password" required>
                            <button type="button" class="password-toggle" aria-label="Show password" tabindex="-1" aria-controls="resetPassword">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                        <div class="password-strength-wrap">
                            <div class="strength-track" aria-hidden="true"><div class="strength-meter"></div></div>
                            <span class="strength-label" aria-live="polite"></span>
                        </div>
                        <ul class="password-reqs">
                            <li class="req-item" data-req="length">Minimum 8 characters</li>
                            <li class="req-item" data-req="upper">At least one uppercase letter</li>
                            <li class="req-item" data-req="lower">At least one lowercase letter</li>
                            <li class="req-item" data-req="number">At least one number</li>
                        </ul>
                    </div>

                    <div class="form-group">
                        <label for="resetConfirm">Confirm New Password *</label>
                        <div class="password-field">
                            <input type="password" id="resetConfirm" name="confirm" class="form-control" autocomplete="new-password" required>
                            <button type="button" class="password-toggle" aria-label="Show password" tabindex="-1" aria-controls="resetConfirm">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-alert" id="resetAlert" role="alert" hidden></div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="resetSubmit">Update Password</button>
                </form>

                <div class="auth-links">
                    <a href="/login">Back to Sign In</a>
                </div>

                <div class="auth-footnote">AI Doctor Assistant &middot; Digital Healthcare Assistance Platform</div>
            </section>
        </main>

    </div>

    <script src="/js/brand.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const token = new URLSearchParams(window.location.search).get('token');
            const form = document.getElementById('resetForm');
            const resetPassword = document.getElementById('resetPassword');

            function showTokenError(message) {
                form.hidden = true;
                const box = document.getElementById('tokenError');
                box.textContent = message;
                box.hidden = false;
            }

            if (!token) {
                showTokenError('This reset link is missing a security token. Please request a new one from the Forgot Password page.');
                return;
            }

            bindPasswordToggles();
            resetPassword.addEventListener('input', function () { renderStrengthMeter(resetPassword); });

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                clearFieldError(resetPassword);
                clearFieldError(document.getElementById('resetConfirm'));
                hideFormAlert('resetAlert');

                let ok = true;
                if (!resetPassword.value) { setFieldError(resetPassword, 'Password is required.'); ok = false; }
                if (!document.getElementById('resetConfirm').value) { setFieldError(document.getElementById('resetConfirm'), 'Please confirm your new password.'); ok = false; }
                if (ok && resetPassword.value !== document.getElementById('resetConfirm').value) {
                    setFieldError(document.getElementById('resetConfirm'), 'Passwords do not match.');
                    ok = false;
                }
                if (!ok) return;

                const btn = document.getElementById('resetSubmit');
                setBusy(btn, true, 'Updating...', 'Update Password');
                try {
                    const res = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: token, newPassword: resetPassword.value })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Unable to reset your password. Please try again.');
                    form.hidden = true;
                    const box = document.getElementById('resetAlert');
                    box.textContent = data.message;
                    box.className = 'form-alert success';
                    box.hidden = false;
                    const link = document.createElement('p');
                    link.className = 'auth-links';
                    link.innerHTML = '<a href="/login">Sign In with your new password</a>';
                    box.after(link);
                } catch (err) {
                    showFormAlert('resetAlert', err.message, 'error');
                } finally {
                    setBusy(btn, false, 'Updating...', 'Update Password');
                }
            });
        });
    </script>
</body>
</html>
