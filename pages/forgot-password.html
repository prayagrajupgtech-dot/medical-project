<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AI Doctor Assistant</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-shell auth-shell-single">

        <main class="auth-main">
            <section class="auth-card" aria-labelledby="fpTitle">
                <div class="auth-card-header">
                    <img src="/images/brand-logo.svg" alt="AI Doctor Assistant logo" class="brand-logo" width="64" height="64">
                    <h2 id="fpTitle">Forgot Password</h2>
                    <p class="auth-subtitle">Reset your account password</p>
                    <p class="auth-caption">Enter your registered email or username and we will send you a secure reset link.</p>
                </div>

                <form id="forgotForm" novalidate>
                    <div class="form-group">
                        <label for="forgotEmail">Email or Username</label>
                        <input type="text" id="forgotEmail" name="email" class="form-control" autocomplete="username" required>
                    </div>

                    <div class="form-alert" id="forgotAlert" role="alert" hidden></div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="forgotSubmit">Send Reset Link</button>
                </form>

                <div class="auth-links">
                    <a href="/login">Back to Sign In</a>
                </div>

                <div class="auth-switch">
                    <p>Don't have an account? <a href="/login?mode=register">Create Account</a></p>
                </div>

                <div class="auth-footnote">AI Doctor Assistant &middot; Digital Healthcare Assistance Platform</div>
            </section>
        </main>

    </div>

    <script src="/js/brand.js?v=4.2"></script>
    <script src="/js/app.js?v=4.2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('forgotForm');
            if (!form) return;
            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                const input = document.getElementById('forgotEmail');
                clearFieldError(input);
                hideFormAlert('forgotAlert');
                if (!input.value.trim()) {
                    setFieldError(input, 'Please enter your email or username.');
                    return;
                }
                const btn = document.getElementById('forgotSubmit');
                setBusy(btn, true, 'Sending...', 'Send Reset Link');
                try {
                    const res = await fetch('/api/auth/forgot-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: input.value.trim() })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Unable to process the request. Please try again.');
                    showFormAlert('forgotAlert', data.message, 'success');
                    const token = data.dev_reset_token;
                    if (token) {
                        const resetUrl = window.location.origin + '/reset-password?token=' + encodeURIComponent(token);
                        const info = document.createElement('p');
                        info.className = 'form-alert form-alert-info';
                        info.setAttribute('role', 'status');
                        info.innerHTML = 'Development mode: your reset link is <a href="' + resetUrl + '">' + resetUrl + '</a> (valid for 1 hour).';
                        document.getElementById('forgotAlert').after(info);
                    }
                } catch (err) {
                    showFormAlert('forgotAlert', err.message, 'error');
                } finally {
                    setBusy(btn, false, 'Sending...', 'Send Reset Link');
                }
            });
        });
    </script>
</body>
</html>
